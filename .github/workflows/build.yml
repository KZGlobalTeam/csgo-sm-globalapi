name: Build

on:
  push:
    branches: [master, dev]
    tags: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  compile:
    name: Compile Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SourceMod
        run: |
          mkdir smdir
          wget -q -O - "http://sourcemod.net/latest.php?os=linux&version=1.12" | tar xzf - -C ./smdir

      - name: Compile
        run: |
          for file in *.sp; do
            echo "Compiling $file..."
            ./smdir/addons/sourcemod/scripting/spcomp64 "$file" -i ./include
          done

      - name: Stage artifacts
        run: |
          mkdir -p package/addons/sourcemod/plugins
          mv ./*.smx package/addons/sourcemod/plugins/

      - uses: actions/upload-artifact@v7
        with:
          name: GlobalAPI
          path: package/

  release:
    name: Create Release
    needs: compile
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GlobalAPI
          path: package

      - name: Package
        run: |
          cd package
          zip -r ../GlobalAPI-v${{ github.ref_name }}.zip .

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            GlobalAPI-v${{ github.ref_name }}.zip
